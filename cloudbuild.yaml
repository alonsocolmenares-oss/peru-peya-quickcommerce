steps:
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '$_SERVICE_NAME'
      - '--source=.'
      - '--region=us-central1'
      - '--project=zb-firebase-projects-poc'
      - '--service-account=cloud-deploy@zb-firebase-projects-poc.iam.gserviceaccount.com'
      - '--allow-unauthenticated'
      # STEP 4: Pin the stable runtime (lowest LTS present on the google-24 builder: 22.x.x / 24.x.x)
      - '--set-build-env-vars=GOOGLE_RUNTIME_VERSION=22'
      # STEP 5: Inyecta las credenciales del webhook de n8n desde Secret Manager como
      # variables de entorno (N8N_WEBHOOK_USER, N8N_WEBHOOK_PASSWORD). El servicio de
      # Cloud Run (cloud-deploy@...) necesita el rol "Secret Manager Secret Accessor"
      # sobre estos dos secrets para poder leerlos.
      - '--update-secrets=N8N_WEBHOOK_USER=N8N_WEBHOOK_USER:latest,N8N_WEBHOOK_PASSWORD=N8N_WEBHOOK_PASSWORD:latest'
options:
  logging: CLOUD_LOGGING_ONLY
substitutions:
  _SERVICE_NAME: 'peru-peya-dashboard-poc'
  # Secrets requeridos (creados en Secret Manager por el equipo de infra):
  #   N8N_WEBHOOK_USER
  #   N8N_WEBHOOK_PASSWORD
